name: Daily Threads Post

on:
  schedule:
    - cron: '30 5 * * *'    # 11:00 AM IST
    - cron: '30 9 * * *'    #  3:00 PM IST
    - cron: '30 15 * * *'   #  9:00 PM IST
  workflow_dispatch:         # allow manual trigger from GitHub Actions tab

# Force Node.js 24 for all actions (suppresses Node.js 20 deprecation warning)
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  post:
    runs-on: ubuntu-latest
    # Needed so the "Commit updated post history" step below can push
    # scripts/post_history.json back to the repo.
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install Playwright Chromium (for infographic rendering)
        run: python -m playwright install --with-deps chromium

      - name: Debug — check secrets presence
        run: |
          echo "GEMINI_API_KEY set:    ${{ secrets.GEMINI_API_KEY != '' }}"
          echo "GEMINI_API_KEY_2 set:  ${{ secrets.GEMINI_API_KEY_2 != '' }}"
          echo "EXA_API_KEY set:       ${{ secrets.EXA_API_KEY != '' }}"
          echo "BUFFER_API_KEY set:    ${{ secrets.BUFFER_API_KEY != '' }}"
          echo "BUFFER_CHANNEL_ID set: ${{ secrets.BUFFER_CHANNEL_ID != '' }}"

      - name: Generate and schedule post
        run: python scripts/generate_and_schedule.py
        env:
          GEMINI_MODEL:       gemini-2.5-flash
          EURON_MODEL:        gemini-2.5-flash
          GEMINI_API_KEY:     ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY_2:   ${{ secrets.GEMINI_API_KEY_2 }}
          EURON_API_KEY:      ${{ secrets.EURON_API_KEY }}
          EXA_API_KEY:        ${{ secrets.EXA_API_KEY }}
          BUFFER_API_KEY:     ${{ secrets.BUFFER_API_KEY }}
          BUFFER_CHANNEL_ID:  ${{ secrets.BUFFER_CHANNEL_ID }}
          # Infographic image: IMGBB_API_KEY hosts the PNG so Buffer can attach it.
          # If the secret is unset, the run auto-falls back to a text-only post.
          IMGBB_API_KEY:      ${{ secrets.IMGBB_API_KEY }}
          INFOGRAPHIC_HANDLE: ${{ vars.INFOGRAPHIC_HANDLE || '@vipinailabs' }}
          # Portfolio URL: text on the infographic + the clickable link that appears
          # alongside FOLLOW_CTA on the rare gate-approved CTA post (see DAY_ROTATION
          # + cta_cap_allows in generate_and_schedule.py — not on every post).
          PORTFOLIO_URL:      ${{ vars.PORTFOLIO_URL || 'vipin-vishal.onrender.com' }}
          # Note: '' escapes the apostrophe inside the Actions expression string.
          PORTFOLIO_CTA:      ${{ vars.PORTFOLIO_CTA || 'See what I''ve been building →' }}
          # Must be the REAL handle, or Threads won't render a tappable mention.
          FOLLOW_CTA:         ${{ vars.FOLLOW_CTA || 'follow @vipinailabs for daily dose of information' }}

      - name: Commit updated post history
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add scripts/post_history.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: update post history [skip ci]"
            git push
          fi
