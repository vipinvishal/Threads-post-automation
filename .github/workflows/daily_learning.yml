name: Daily Threads Intelligence

on:
  schedule:
    - cron: '0 3 * * *'     # 8:30 AM IST, before the first post
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

concurrency:
  group: threads-growth-state
  cancel-in-progress: false

jobs:
  learn:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Refresh metrics, trends, candidates, and skill memory
        run: python scripts/daily_learning.py
        env:
          GEMINI_MODEL:         gemini-2.5-flash
          EURON_MODEL:          gemini-2.5-flash
          GEMINI_API_KEY:       ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY_2:     ${{ secrets.GEMINI_API_KEY_2 }}
          EURON_API_KEY:        ${{ secrets.EURON_API_KEY }}
          EXA_API_KEY:          ${{ secrets.EXA_API_KEY }}
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}

      - name: Commit refreshed intelligence
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add scripts/post_history.json scripts/account_insights.json scripts/daily_intelligence.json skills/threads-growth/SKILL.md
          if ! git diff --cached --quiet; then
            git commit -m "chore: refresh daily Threads intelligence [skip ci]"
            git push
          fi
